name:  explorer.prod4.grid.tf
on:
  push:
    branches: [ development ]

jobs:
  job_one:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: pushing latest changes on explorer.prod4.grid.tf
      uses: appleboy/ssh-action@master
      with:
        host: explorer.prod4.grid.tf
        username: ${{ secrets.TF_USER }}
        key: ${{ secrets.TF_SECRET }}
        port: ${{ secrets.TF_PORT }}
        script: |
          cd websites/explorer-v4
          git pull
          
