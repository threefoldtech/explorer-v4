<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node Details - Grid4 Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Grid4 Dashboard</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="farms.html">Farms</a></li>
                    <li><a href="nodes.html" class="active">Nodes</a></li>
                </ul>
            </nav>
            <div class="env-selector-container">
                <span id="env-badge" class="env-badge">Development</span>
                <select id="env-selector" title="Select environment">
                    <option value="dev">Development</option>
                    <option value="qa">QA</option>
                    <option value="test">Test</option>
                    <option value="prod">Production</option>
                </select>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="page-header">
            <h2>Node Details</h2>
            <a href="nodes.html" class="btn-small">Back to Nodes</a>
        </section>

        <section id="node-details" class="details-container">
            <div class="loading">Loading node details...</div>
        </section>

        <section class="related-data">
            <h3>Node Resources</h3>
            <div id="node-resources" class="resources-container">
                <div class="loading">Loading resources...</div>
            </div>
        </section>

        <section class="related-data">
            <h3>Node Interfaces</h3>
            <div id="node-interfaces" class="interfaces-container">
                <div class="loading">Loading interfaces...</div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Grid4 Dashboard</p>
            <p id="api-status">API Status: Checking...</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/node-details.js"></script>
</body>
</html>
